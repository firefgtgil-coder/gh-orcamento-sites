<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>GH - Orçamento de Sites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #060607;
        --bg-2: #0b0b0d;
        --warm: #ffb45e;
        --warm-soft: #ffd9a3;
        --warm-deep: #ff8a3d;
        --ink: #f4f1ea;
        --ink-dim: rgba(244, 241, 234, 0.62);
        --ink-faint: rgba(244, 241, 234, 0.38);
        --glass: rgba(255, 255, 255, 0.07);
        --glass-border: rgba(255, 255, 255, 0.16);
        --field: rgba(255, 255, 255, 0.06);
        --field-border: rgba(255, 255, 255, 0.14);
        --blue: #45b7ff;
        --wa: #25d366;
        --radius-card: 26px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(1200px 700px at 78% 30%, rgba(255, 170, 80, 0.05), transparent 60%),
          radial-gradient(900px 600px at 10% 110%, rgba(69, 183, 255, 0.04), transparent 55%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--ink);
        font-family: "Manrope", system-ui, sans-serif;
        overflow-x: hidden;
      }
      button, select, input, textarea { font: inherit; }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }

      .scene {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      /* vignette + floor line */
      .scene::before {
        content: "";
        position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
        z-index: 3;
      }
      .scene::after {
        content: "";
        position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
        background: linear-gradient(180deg, transparent, rgba(255, 180, 94, 0.045));
        pointer-events: none;
        z-index: 0;
      }

      /* ---------- header ---------- */
      .topbar {
        position: relative; z-index: 5;
        display: flex; align-items: center; gap: 0.8rem;
        padding: 1.1rem clamp(1.1rem, 4vw, 2.6rem) 0.4rem;
      }
      .topbar img {
        width: 46px; height: 46px; border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.18), 0 6px 18px rgba(0,0,0,0.6);
      }
      .topbar .brand { line-height: 1.1; }
      .topbar .brand strong {
        font-family: "Sora", sans-serif; font-size: 1.3rem; font-weight: 800; letter-spacing: 0.14em;
      }
      .topbar .brand span {
        display: block; font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim);
      }
      .topbar .hours {
        margin-left: auto;
        display: inline-flex; align-items: center; gap: 0.5rem;
        font-size: 0.82rem; color: var(--ink-dim);
        padding: 0.45rem 0.9rem;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 999px;
        background: rgba(255,255,255,0.03);
      }
      .topbar .hours i {
        width: 8px; height: 8px; border-radius: 50%; background: var(--wa);
        box-shadow: 0 0 10px var(--wa);
        animation: pulse-dot 2.2s ease-in-out infinite;
      }
      @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

      /* ---------- stage ---------- */
      .stage {
        position: relative; z-index: 2;
        flex: 1;
        display: grid;
        grid-template-columns: minmax(300px, 42%) 1fr;
        align-items: center;
        gap: clamp(0.5rem, 3vw, 3rem);
        width: min(1240px, 100%);
        margin: 0 auto;
        padding: 0.5rem clamp(1.1rem, 4vw, 2.6rem) 0;
      }

      /* light cone + landing glow (only visible when .on) */
      .cone, .cone-core, .landing-glow {
        position: absolute;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.9s ease 0.15s;
        z-index: 1;
      }
      .cone {
        top: 14%;
        left: 15%;
        width: 76%;
        height: 82%;
        background: linear-gradient(100deg, rgba(255, 190, 105, 0.46) 0%, rgba(255, 170, 80, 0.2) 42%, rgba(255, 160, 70, 0.05) 78%, transparent 100%);
        clip-path: polygon(0 20%, 100% 6%, 100% 100%, 0 88%);
        filter: blur(30px);
        transform-origin: 0 50%;
      }
      .cone-core {
        top: 17%;
        left: 17%;
        width: 64%;
        height: 70%;
        background: linear-gradient(100deg, rgba(255, 214, 150, 0.55) 0%, rgba(255, 190, 105, 0.18) 55%, transparent 100%);
        clip-path: polygon(0 26%, 100% 14%, 100% 92%, 0 84%);
        filter: blur(12px);
        transform-origin: 0 52%;
      }
      .landing-glow {
        top: 16%;
        right: 2%;
        width: 56%;
        height: 72%;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255, 186, 102, 0.28) 0%, rgba(255, 170, 80, 0.1) 55%, transparent 75%);
        filter: blur(10px);
      }
      .scene.on .cone, .scene.on .cone-core, .scene.on .landing-glow { opacity: 1; }
      .scene.flicker .cone, .scene.flicker .cone-core, .scene.flicker .landing-glow {
        animation: flicker 0.75s steps(1, end) 1;
      }
      @keyframes flicker {
        0% { opacity: 0; } 12% { opacity: 0.85; } 22% { opacity: 0.1; }
        38% { opacity: 1; } 50% { opacity: 0.25; } 66% { opacity: 0.95; }
        82% { opacity: 0.5; } 100% { opacity: 1; }
      }

      /* ---------- lamp (pendant photo) ---------- */
      .lamp-zone {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center;
        align-self: start;
        padding-top: 0.5rem; padding-bottom: 0.5rem;
      }
      .lamp-btn {
        background: none; border: 0; padding: 0; cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        border-radius: 18px;
        display: flex; flex-direction: column; align-items: center;
      }
      .lamp-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
      .lamp-cord {
        width: 2px; height: clamp(36px, 6vh, 64px);
        background: linear-gradient(180deg, rgba(255,255,255,0.05), #2c2c30 45%, #3c3f45);
        border-radius: 2px;
      }
      .lamp-photo {
        position: relative;
        width: clamp(230px, 27vw, 330px);
      }
      .lamp-photo img {
        display: block; width: 100%; height: auto;
        /* photo bg is near-black like the page, so it blends in */
        -webkit-mask-image: radial-gradient(78% 72% at 50% 48%, #000 62%, transparent 99%);
        mask-image: radial-gradient(78% 72% at 50% 48%, #000 62%, transparent 99%);
        filter: brightness(0.16) saturate(0.35);
        transition: filter 0.55s ease;
      }
      .lamp-photo .lamp-halo {
        position: absolute; inset: 0;
        background: radial-gradient(38% 30% at 50% 62%, rgba(255, 205, 130, 0.75) 0%, rgba(255, 176, 92, 0.28) 52%, transparent 78%);
        filter: blur(14px);
        opacity: 0;
        transition: opacity 0.7s ease 0.1s;
        pointer-events: none;
      }
      .scene.on .lamp-photo img { filter: brightness(1.06) saturate(1.05); }
      .scene.on .lamp-photo .lamp-halo { opacity: 1; }
      .scene.flicker .lamp-photo img { animation: photo-flicker 0.75s steps(1, end) 1; }
      .scene.flicker .lamp-photo .lamp-halo { animation: flicker 0.75s steps(1, end) 1; }
      @keyframes photo-flicker {
        0% { filter: brightness(0.16) saturate(0.35); } 12% { filter: brightness(1.02) saturate(1); }
        22% { filter: brightness(0.35) saturate(0.5); } 38% { filter: brightness(1.1) saturate(1.05); }
        50% { filter: brightness(0.45) saturate(0.55); } 66% { filter: brightness(1.05) saturate(1.02); }
        82% { filter: brightness(0.7) saturate(0.8); } 100% { filter: brightness(1.06) saturate(1.05); }
      }
      .hint {
        margin: 1.1rem 0 0;
        display: inline-flex; align-items: center; gap: 0.55rem;
        font-size: 0.9rem; font-weight: 600; color: var(--warm-soft);
        background: rgba(255, 180, 94, 0.08);
        border: 1px solid rgba(255, 180, 94, 0.35);
        padding: 0.6rem 1.05rem; border-radius: 999px;
        cursor: pointer;
        animation: hint-breathe 2.4s ease-in-out infinite;
        transition: opacity 0.5s ease, transform 0.5s ease;
        min-height: 2.75rem;
      }
      .hint svg { flex: none; }
      @keyframes hint-breathe {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 180, 94, 0.0); }
        50% { box-shadow: 0 0 24px 2px rgba(255, 180, 94, 0.22); }
      }
      .scene.on .hint { opacity: 0; transform: translateY(8px); pointer-events: none; }
      .switch-note {
        margin-top: 0.9rem; font-size: 0.78rem; color: var(--ink-faint);
        opacity: 0; transition: opacity 0.6s ease 0.4s;
      }
      .scene.on .switch-note { opacity: 1; }

      /* ---------- glass card / form ---------- */
      .card-zone { position: relative; z-index: 2; display: flex; justify-content: center; }
      .glass-card {
        width: min(520px, 100%);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-card);
        backdrop-filter: blur(18px) saturate(1.3);
        -webkit-backdrop-filter: blur(18px) saturate(1.3);
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 0 60px rgba(255, 190, 105, 0.05);
        padding: clamp(1.4rem, 3.4vw, 2.2rem);
        opacity: 0;
        transform: translateY(26px) scale(0.97);
        transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.25s, transform 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.25s;
        pointer-events: none;
      }
      .scene.on .glass-card { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
      .card-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.4rem; }
      .card-head img {
        width: 64px; height: 64px; border-radius: 50%; flex: none;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.22), 0 0 26px rgba(69, 183, 255, 0.35), 0 10px 22px rgba(0,0,0,0.5);
      }
      .card-head h1 {
        font-family: "Sora", sans-serif;
        font-size: clamp(1.35rem, 3.4vw, 1.7rem);
        line-height: 1.15; margin: 0; font-weight: 700;
      }
      .card-head h1 em { font-style: normal; color: var(--warm-soft); }
      .card-head p { margin: 0.3rem 0 0; font-size: 0.9rem; color: var(--ink-dim); }
      .glass-card fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
      .field { margin-top: 1rem; }
      .field label {
        display: block; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em;
        color: var(--ink); margin-bottom: 0.42rem;
      }
      .field label span { color: var(--warm); }
      .field input, .field select, .field textarea {
        width: 100%;
        background: var(--field);
        border: 1px solid var(--field-border);
        border-radius: 12px;
        color: var(--ink);
        padding: 0.72rem 0.9rem;
        font-size: 0.98rem;
        outline: none;
        transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      }
      .field textarea { resize: vertical; min-height: 96px; }
      .field input::placeholder, .field textarea::placeholder { color: var(--ink-faint); }
      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: rgba(255, 180, 94, 0.65);
        background: rgba(255, 255, 255, 0.09);
        box-shadow: 0 0 0 3px rgba(255, 180, 94, 0.18);
      }
      .field select option { background: #17181c; color: var(--ink); }
      .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
      .submit-btn {
        margin-top: 1.35rem;
        width: 100%;
        display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
        background: linear-gradient(135deg, var(--warm-soft) 0%, var(--warm) 45%, var(--warm-deep) 100%);
        color: #241203;
        font-family: "Sora", sans-serif; font-weight: 700; font-size: 1rem;
        border: 0; border-radius: 14px;
        padding: 0.95rem 1.2rem;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(255, 150, 60, 0.35), inset 0 1px 0 rgba(255,255,255,0.55);
        transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        min-height: 3.2rem;
      }
      .submit-btn:hover { filter: brightness(1.06); box-shadow: 0 16px 36px rgba(255, 150, 60, 0.45), inset 0 1px 0 rgba(255,255,255,0.55); }
      .submit-btn:active { transform: translateY(1px) scale(0.99); }
      .submit-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
      .form-status {
        margin: 0.85rem 0 0; min-height: 1.25rem;
        font-size: 0.88rem; color: var(--warm-soft); text-align: center;
      }
      .form-status.error { color: #ff9d8a; }
      .direct {
        margin-top: 0.35rem; text-align: center; font-size: 0.86rem; color: var(--ink-dim);
      }
      .direct a {
        color: var(--ink); font-weight: 700; text-decoration: none;
        border-bottom: 1px solid rgba(255, 180, 94, 0.55);
        padding: 0.35rem 0.1rem; display: inline-block; min-height: 2rem;
      }
      .direct a:hover { color: var(--warm-soft); }

      /* ---------- responsive ---------- */
      @media (max-width: 880px) {
        .stage { grid-template-columns: 1fr; gap: 0.2rem; padding-top: 0; flex: 0 1 auto; }
        .lamp-zone { align-self: center; order: 1; padding: 0.2rem 0 0; }
        .lamp-cord { height: 26px; }
        .lamp-photo { width: 168px; }
        .card-zone { order: 2; padding-top: 0.6rem; padding-bottom: 1.6rem; }
        .cone, .cone-core { display: none; }
        .landing-glow {
          top: auto; bottom: -10%; right: auto; left: 0; width: 100%; height: 62%;
          background: radial-gradient(50% 50% at 50% 50%, rgba(255, 186, 102, 0.2) 0%, rgba(255, 170, 80, 0.07) 55%, transparent 78%);
          filter: blur(26px);
        }
        .hint { margin-top: 0.7rem; }
        .switch-note { display: none; }
        .row-2 { grid-template-columns: 1fr; gap: 0; }
        .topbar .hours { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>

    <script>
      (function () {
        var scene = document.getElementById("scene");
        var lampBtn = document.getElementById("lampBtn");
        var hintBtn = document.getElementById("hintBtn");
        var fields = document.getElementById("formFields");
        var form = document.getElementById("quoteForm");
        var status = document.getElementById("formStatus");
        var tel = document.getElementById("f-tel");
        var on = true;
        // the lamp lights up on arrival (flicker), like the reference video;
        // clear the flicker class once the animation has played
        setTimeout(function () { scene.classList.remove("flicker"); }, 1000);

        function setLight(next) {
          on = next;
          lampBtn.setAttribute("aria-pressed", String(on));
          fields.disabled = !on;
          if (on) {
            scene.classList.add("on");
            scene.classList.remove("flicker");
            // restart the flicker animation
            void scene.offsetWidth;
            scene.classList.add("flicker");
            setTimeout(function () {
              var nome = document.getElementById("f-nome");
              if (nome && window.matchMedia("(min-width: 881px)").matches) nome.focus({ preventScroll: true });
            }, 900);
          } else {
            scene.classList.remove("on", "flicker");
          }
        }
        lampBtn.addEventListener("click", function () { setLight(!on); });
        hintBtn.addEventListener("click", function () { setLight(true); });

        // gentle Brazilian phone mask: (12) 99999-9999
        tel.addEventListener("input", function () {
          var d = tel.value.replace(/\D/g, "").slice(0, 11);
          var out = d;
          if (d.length > 6) out = "(" + d.slice(0, 2) + ") " + d.slice(2, d.length - 4) + "-" + d.slice(-4);
          else if (d.length > 2) out = "(" + d.slice(0, 2) + ") " + d.slice(2);
          else if (d.length > 0) out = "(" + d;
          tel.value = out;
        });

        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var nome = document.getElementById("f-nome").value.trim();
          var fone = tel.value.trim();
          var tipo = document.getElementById("f-tipo").value;
          var desc = document.getElementById("f-desc").value.trim();

          if (!nome || fone.replace(/\D/g, "").length < 10) {
            status.textContent = "Preencha seu nome e um WhatsApp válido para continuar.";
            status.classList.add("error");
            (!nome ? document.getElementById("f-nome") : tel).focus();
            return;
          }
          status.classList.remove("error");

          var linhas = [
            "Olá! Vim pelo site da GH e quero solicitar um orçamento.",
            "",
            "Nome: " + nome,
            "WhatsApp: " + fone,
            "Tipo de projeto: " + tipo
          ];
          if (desc) linhas.push("Descrição do projeto: " + desc);
          var url = "https://wa.me/5512981245005?text=" + encodeURIComponent(linhas.join("\n"));
          status.textContent = "Abrindo seu WhatsApp com a mensagem pronta…";
          window.open(url, "_blank", "noopener");
        });
      })();
    </script>
  </body>
